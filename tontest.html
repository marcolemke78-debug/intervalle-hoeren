<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tontest</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; background: #fff; }
  button { display: block; width: 100%; min-height: 56px; margin: 0.75rem 0; font-size: 1.1rem; border-radius: 10px; border: 1px solid #2563EB; background: #DBEAFE; color: #1D4ED8; cursor: pointer; }
  #log { background: #f3f4f6; border-radius: 8px; padding: 0.75rem 1rem; font-family: Menlo, monospace; font-size: 0.85rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Tontest</h1>
<p><strong>Wichtig:</strong> Seite in Safari neu laden, dann die Knöpfe <strong>genau in dieser Reihenfolge</strong> antippen und dir merken, wo du etwas hörst. Danach ein Bildschirmfoto vom grauen Kasten.</p>
<button id="b1">1 · Einfacher Piepton</button>
<button id="b2">2 · App-Ton (ohne iPad-Einstellung)</button>
<button id="b3">3 · App-Ton (mit iPad-Einstellung „playback")</button>
<div id="log">Noch nichts angetippt.</div>
<script src="js/exercises.js?v=4"></script>
<script src="js/ton.js?v=4"></script>
<script>
  Ton.noSession = true; // erste Berührung soll noch nichts an der iPad-Einstellung ändern
  const log = document.getElementById('log');
  const lines = [];
  function add(t) { lines.push(t); log.textContent = lines.join('\n'); }
  window.addEventListener('error', e => add('FEHLER: ' + e.message));
  window.addEventListener('unhandledrejection', e => add('FEHLER (Promise): ' + e.reason));
  add('Browser: ' + navigator.userAgent.replace(/.*\) /, ''));
  add('audioSession: ' + (navigator.audioSession ? navigator.audioSession.type : 'gibt es nicht'));
  function status(name, ctx) {
    setTimeout(() => add(name + ': Zustand = ' + (ctx ? ctx.state : 'kein Context') + ', Zeit = ' + (ctx ? ctx.currentTime.toFixed(2) : '-')
      + ', audioSession = ' + (navigator.audioSession ? navigator.audioSession.type : '-')), 700);
  }

  document.getElementById('b1').addEventListener('click', () => {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      ctx.resume();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      g.gain.value = 0.3;
      o.frequency.value = 440;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 1);
      status('1 Piepton', ctx);
    } catch (e) { add('1 FEHLER: ' + e); }
  });

  document.getElementById('b2').addEventListener('click', () => {
    try {
      Ton.ctx = null;
      Ton.noSession = true;
      Ton.demo(4, 'up');
      status('2 App ohne', Ton.ctx);
    } catch (e) { add('2 FEHLER: ' + e); }
  });

  document.getElementById('b3').addEventListener('click', () => {
    try {
      Ton.ctx = null;
      Ton.noSession = false;
      Ton.demo(4, 'up');
      status('3 App mit', Ton.ctx);
    } catch (e) { add('3 FEHLER: ' + e); }
  });
</script>
</body>
</html>
